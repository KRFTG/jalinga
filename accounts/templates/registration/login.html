<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffffff;
        }
        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            text-align: center;
        }
        input[type="email"],
        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            margin: 8px 0;
            display: inline-block;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
            color: #333;
        }
        input::placeholder { color: #888; }
        .btn-submit {
            width: 100%;
            background-color: #0066b2;
            color: white;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 500;
        }
        .btn-submit:hover { background-color: #005596; }
        .footer-links {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .footer-links a {
            color: #0066b2;
            text-decoration: none;
            font-size: 14px;
        }
        .footer-links a:hover { text-decoration: underline; }
        .errorlist { color: #dc3545; list-style: none; padding: 0; margin: 5px 0; }
    </style>
</head>
<body>
<div class="login-container">
    {% if form.errors %}
        <p style="color: #dc3545;">Неверный email или пароль.</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <input type="email" name="username" placeholder="Email" value="{{ form.username.value|default_if_none:'' }}" required>
        <input type="password" name="password" placeholder="Пароль" required>
        <button type="submit" class="btn-submit">Войти</button>
    </form>
    <div class="footer-links">
        <a href="{% url 'password_reset' %}">Забыли пароль?</a>
        <a href="{% url 'register' %}">Регистрация</a>
    </div>
</div>
</body>
</html>
