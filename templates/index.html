{% extends 'base.html' %}
{% load static %}

{% block title %}Джалинга — Студия самозаписи{% endblock %}

{% block extra_head %}
<style>
    .home-video {
        max-width: 1200px;   /* было 800px */
        margin: 20px auto;   /* уменьшен верхний отступ */
        padding: 0 20px 40px;
        text-align: center;
    }
    .home-video h2 {
        margin-bottom: 25px;
        color: #0056b3;
        font-size: 2.2rem;  /* крупнее заголовок */
    }
    .video-container {
        position: relative;
        padding-bottom: 56.25%; /* 16:9 */
        height: 0;
        overflow: hidden;
        max-width: 100%;
        background: #000;
        border-radius: 16px;
        box-shadow: 0 6px 25px rgba(0,0,0,0.15);
    }
    .video-container video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: 0;
        object-fit: cover;   /* заполняет контейнер */
    }
    .home-video p {
        margin-top: 20px;
        color: #555;
        font-size: 1.1rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="home-video">
    <h2>Добро пожаловать в студию «Джалинга»</h2>
    <div class="video-container">
        <video autoplay muted loop playsinline>
            <source src="/media/videos/jalinga_studios.mp4" type="video/mp4">
            Ваш браузер не поддерживает видео.
        </video>
    </div>
</div>
{% endblock %}
